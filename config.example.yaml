# vcon-__ADAPTER_NAME__-adapter configuration
# All ${ENV_VAR} placeholders are substituted at startup.

adapter:
  name: __ADAPTER_NAME__
  source_platform: __SOURCE_PLATFORM__

# Source platform credentials
source:
  api_key: ${__ADAPTER_PACKAGE___API_KEY}
  # Add platform-specific options here

# vCon construction
vcon:
  syntax: "0.4.0"
  # Optional: list extensions this adapter emits
  extensions:
    - sip-signaling
    - lawful_basis
  # Optional: JWS signing (RS256) — NOT IMPLEMENTED in this template yet.
  # Left here as a placeholder for adapters that add it; delete if unused.
  # signing:
  #   enabled: false
  #   private_key_path: ${VCON_SIGNING_KEY_PATH}
  #   key_id: ${VCON_SIGNING_KEY_ID}

  # Optional: lawful-basis attachment (draft-howe-vcon-lawful-basis).
  # LAWFUL_BASIS / LAWFUL_BASIS_* env vars override these fields one-by-one;
  # see LawfulBasisConfig.resolve() in vcon_builder.py. Leave `lawful_basis`
  # unset (or delete this block) to build vCons with no lawful-basis
  # attachment — never invent a basis here.
  lawful_basis:
    lawful_basis: ${LAWFUL_BASIS}  # consent|contract|legal_obligation|vital_interests|public_task|legitimate_interests
    purposes:
      - recording
    jurisdiction: ${LAWFUL_BASIS_JURISDICTION}
    expiration: ${LAWFUL_BASIS_EXPIRATION}
    proof_mechanism: ${LAWFUL_BASIS_PROOF_MECHANISM}
    proof_description: ${LAWFUL_BASIS_PROOF_DESCRIPTION}

# Delivery mode: "webhook" (generic HTTP + HMAC) or "conserver" (direct
# POST to a vcon-server instance). Only the selected section below is used.
delivery:
  mode: webhook

# Webhook delivery (delivery.mode: webhook)
webhook:
  endpoints:
    - url: ${VCON_WEBHOOK_URL}
      hmac_secret: ${VCON_WEBHOOK_HMAC_SECRET}
      timeout_seconds: 30
  retry:
    max_attempts: 5
    initial_backoff_seconds: 1
    max_backoff_seconds: 60
  dead_letter_path: /app/vcons/dlq

# Conserver-direct delivery (delivery.mode: conserver)
# POSTs to {url}/vcon with header `x-conserver-api-token: ${CONSERVER_API_TOKEN}`
# and repeated `?ingress_lists=...` query params. Reuses the same
# retry/backoff/DLQ implementation as webhook delivery (ConserverDelivery's
# constructor defaults match WebhookConfig's); not yet exposed as separate
# YAML keys here — pass overrides directly to ConserverDelivery(...) if needed.
conserver:
  url: ${CONSERVER_URL}
  token: ${CONSERVER_API_TOKEN}
  token_header: x-conserver-api-token
  ingress_lists:
    - default

# Local filesystem storage (optional)
storage:
  enabled: true
  path: /app/vcons
  filename_pattern: "{uuid}.vcon.json"

# Observability
server:
  host: 0.0.0.0
  port: 8000

logging:
  level: INFO
  format: json
