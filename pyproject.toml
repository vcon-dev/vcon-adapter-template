[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcon-__ADAPTER_NAME__-adapter"
version = "0.1.0"
description = "Adapter that converts __SOURCE_PLATFORM__ events into vCons"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "vCon Dev" }]
keywords = ["vcon", "adapter", "__ADAPTER_NAME__"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vcon>=0.9.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "jsonschema>=4.20.0",
]
signing = ["cryptography>=42.0.0"]

[project.scripts]
__ADAPTER_PACKAGE__ = "__ADAPTER_PACKAGE__.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/__ADAPTER_PACKAGE__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
